name: Secret Scan

# Scans the repository (full history on push, the diff on PRs) for committed
# secrets — API keys, tokens, private keys, HSM PINs — using Gitleaks.
#
# Note: GitHub also offers native secret scanning (Settings > Code security),
# free for public repos. This workflow adds in-CI / PR-gating coverage on top.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history so push scans cover the new commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub organization accounts.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
