name: CI

# Build, vet and run the test suite against SoftHSM2. Dependencies resolve from
# the committed vendor/ tree, so the pkcs11-go replace target needs no sibling
# checkout. Replaces the legacy .travis.yml pipeline.
#
# SoftHSM2 (from apt) is used as the PKCS#11 module. Tests that require
# PKCS#11 v3.2 features (ML-KEM) self-skip via skipIfMechUnsupported when the
# loaded module does not support them. Token provisioning is handled entirely
# by TestMain via the PKCS#11 API — no softhsm2-util pre-init needed.
#
# For full ML-KEM coverage, run locally with SoftHSMv3:
#   PKCS11_MODULE=/path/to/libsofthsmv3.so go test ./...
#   (https://github.com/pqctoday-org/pqctoday-hsm)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  # Local `replace` directive (=> ../pkcs11-go) points at a sibling checkout
  # that does not exist on the runner; resolve deps from the vendor/ tree.
  GOFLAGS: -mod=vendor

jobs:
  build-test:
    name: Build & test (SoftHSM2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2

      - name: Test
        # TestMain bootstraps an ephemeral token via the PKCS#11 API when
        # PKCS11_MODULE is set — no softhsm2-util pre-init required.
        # ML-KEM and other v3.2 tests self-skip on SoftHSM2.
        env:
          PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: go test -count=1 -v ./...
