name: CI

# Build, vet and run the test suite against a PKCS #11 module with full
# post-quantum support. Dependencies (including
# github.com/eclipse-keypont/pkcs11-go) resolve from the published module
# proxy — there is no local `replace` directive.
#
# The module is SoftHSMv2 `main` built from source with ML-KEM and ML-DSA
# enabled, against the runner's OpenSSL 3.5 (see
# .github/actions/setup-softhsmv2-pqc). The apt package on ubuntu-24.04 is
# 2.6.1, which has no ML-KEM/ML-DSA; building from source adds them.
#
# Building from source also makes the token enforce the PKCS#11 minimum HMAC
# key sizes (SHA384-HMAC >= 48 bytes, SHA512-HMAC >= 64 bytes) that 2.6.1
# advertised incorrectly as one byte. TestGenerateHMACKeyFallback now sizes each
# key to its digest, so it passes on both.
#
# The job runs on ubuntu-26.04 because that image ships OpenSSL 3.5, which
# SoftHSMv2 needs for ML-KEM/ML-DSA. ubuntu-24.04 ships OpenSSL 3.0.13.
#
# Token provisioning is handled entirely by TestMain via the PKCS#11 API — no
# softhsm2-util pre-init needed.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (SoftHSMv2 PQC)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Set up SoftHSMv2 (PQC)
        # Builds SoftHSMv2 main with ML-KEM/ML-DSA against the runner's
        # OpenSSL 3.5 and exports PKCS11_MODULE for the test step below.
        uses: ./.github/actions/setup-softhsmv2-pqc

      - name: Test
        # TestMain bootstraps an ephemeral token via the PKCS#11 API when
        # PKCS11_MODULE is set — no softhsm2-util pre-init required.
        # ML-KEM and other v3.2 tests now run instead of self-skipping.
        run: go test -count=1 -race -v ./...
