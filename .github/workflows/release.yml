name: Release

# Source-release supply-chain pipeline for the library. On a v* tag:
#
#   build ──► provenance ──► verify
#
#   1. build      — deterministic source archive (git archive), CycloneDX SBOM,
#                   SHA-256 checksums, keyless cosign signatures, and GitHub
#                   Release creation.
#   2. provenance — SLSA3 build provenance covering BOTH the archive and the
#                   SBOM, generated by the slsa-github-generator reusable
#                   workflow and attached to the Release as
#                   crypto11-<tag>.intoto.jsonl.
#   3. verify     — slsa-verifier re-checks the provenance against both
#                   artifacts, so a broken release fails loudly instead of
#                   shipping.
#
# NOTE FOR A LIBRARY: `go get` consumers fetch source from the Go module proxy
# and verify it via go.sum + sum.golang.org (the checksum transparency log);
# they do NOT consume these release assets. The signed archive + SLSA provenance
# serve auditors and satisfy OpenSSF Scorecard's Signed-Releases check. The tag
# itself is GPG/SSH-signed by `make release` (git tag -s) — verify with
# `git verify-tag <tag>`.
#
# All signing is keyless: cosign and the SLSA generator use the OIDC token
# GitHub issues when id-token:write is granted. No secrets, no key material.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # -- 0. Quality gates — a tag must not ship if these fail ------------------
  # Reuse the existing Lint and Vulnerability-Scan workflows (workflow_call) so
  # the release runs exactly the same checks as CI, with no duplicated logic.
  lint:
    name: Lint gate
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  govulncheck:
    name: Vulnerability gate
    permissions:
      contents: read
    uses: ./.github/workflows/govulncheck.yml

  # -- 1. Build, checksum, sign, and publish the source archive --------------
  build:
    name: Build & sign source archive + SBOM
    needs: [lint, govulncheck]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release and upload assets
      id-token: write  # cosign keyless signing via OIDC
    env:
      # cyclonedx-gomod is pinned by version; `go install` verifies it against
      # the Go checksum database (sum.golang.org), same trust model as go.sum.
      CDX_GOMOD_VERSION: v1.10.0
    outputs:
      hashes:     ${{ steps.hash.outputs.hashes }}
      archive:    ${{ steps.archive.outputs.name }}
      sbom:       ${{ steps.sbom.outputs.name }}
      provenance: ${{ steps.archive.outputs.provenance }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # git archive is deterministic for a given tag (file mtimes come from the
      # commit), so the archive is reproducible from the tagged commit alone.
      - name: Build deterministic source archive
        id: archive
        run: |
          name="crypto11-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz \
            --prefix="crypto11-${GITHUB_REF_NAME}/" \
            -o "${name}" "${GITHUB_REF_NAME}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          # Provenance now covers two subjects, so it is named after the release
          # rather than after a single artifact.
          echo "provenance=crypto11-${GITHUB_REF_NAME}.intoto.jsonl" >> "$GITHUB_OUTPUT"

      # CycloneDX 1.6 SBOM of the module: the crypto11 component itself, its
      # build-time dependency graph, the Go standard library (-std, so stdlib
      # CVEs are visible to SBOM consumers) and detected licenses (as evidence).
      # Test-only dependencies are excluded — they are not part of what a
      # consumer of the library links against.
      #
      # -noserial -notimestamp drop the two nondeterministic fields, so the SBOM
      # is byte-reproducible from the tagged commit (see `make sbom`).
      - name: Generate CycloneDX SBOM
        id: sbom
        run: |
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CDX_GOMOD_VERSION}"
          name="crypto11-${GITHUB_REF_NAME}.cdx.json"
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod \
            -json -licenses -std -type library \
            -noserial -notimestamp \
            -output "${name}" .
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        id: hash
        run: |
          archive="${{ steps.archive.outputs.name }}"
          sbom="${{ steps.sbom.outputs.name }}"
          sha256sum "${archive}" > "${archive}.sha256"
          sha256sum "${sbom}"    > "${sbom}.sha256"
          # base64-encoded sha256sum output — the SLSA generator's subject
          # format, one "<hash>  <name>" line per subject.
          echo "hashes=$(cat "${archive}.sha256" "${sbom}.sha256" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign archive and SBOM (keyless)
        run: |
          for f in "${{ steps.archive.outputs.name }}" "${{ steps.sbom.outputs.name }}"; do
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "${f}"
          done

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="${{ steps.archive.outputs.name }}"
          sbom="${{ steps.sbom.outputs.name }}"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            "${archive}" \
            "${archive}.sha256" \
            "${archive}.cosign.bundle" \
            "${sbom}" \
            "${sbom}.sha256" \
            "${sbom}.cosign.bundle"

  # -- 2. SLSA3 provenance for the source archive and the SBOM ---------------
  provenance:
    name: SLSA3 provenance
    needs: [build]
    permissions:
      actions: read     # read the workflow run metadata
      id-token: write   # keyless signing of the provenance
      contents: write   # upload crypto11-<tag>.intoto.jsonl to the Release
    # The SLSA generator reusable workflow MUST be pinned by semantic-version tag
    # (not a commit hash): it verifies its own identity in Rekor against that tag.
    # OpenSSF Scorecard's pinned-dependencies check exempts this repository.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: ${{ needs.build.outputs.provenance }}
      upload-assets: true

  # -- 3. End-to-end verification of the published provenance ----------------
  verify:
    name: Verify provenance
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read  # download release assets
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "crypto11-*.tar.gz" \
            --pattern "crypto11-*.cdx.json" \
            --pattern "*.intoto.jsonl"

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Verify provenance against archive and SBOM
        run: |
          slsa-verifier verify-artifact \
            --provenance-path "$(ls ./*.intoto.jsonl)" \
            --source-uri "github.com/${GITHUB_REPOSITORY}" \
            --source-tag "${GITHUB_REF_NAME}" \
            "${{ needs.build.outputs.archive }}" \
            "${{ needs.build.outputs.sbom }}"
