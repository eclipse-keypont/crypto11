name: Scorecard

# OpenSSF Scorecard rates the repo's supply-chain security posture (branch
# protection, token permissions, pinned dependencies, dangerous workflow
# patterns) and publishes results to code scanning and the public Scorecard API.

on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

# Top-level token has minimal access; the job requests only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish results to the public OpenSSF API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to https://api.securityscorecards.dev for the
          # badge. Set to false to keep results private.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
