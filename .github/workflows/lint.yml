name: Lint

# golangci-lint (configured via .golangci.yml) bundles staticcheck, gosec,
# formatters and more — the modern replacement for the deprecated golint.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allows the Release pipeline to gate a tag on a passing lint run.
  workflow_call:

permissions:
  contents: read

env:
  GOFLAGS: -mod=vendor

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
