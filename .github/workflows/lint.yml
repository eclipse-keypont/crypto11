name: Lint

# golangci-lint (configured via .golangci.yml) bundles staticcheck, gosec,
# formatters and more — the modern replacement for the deprecated golint.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allows the Release pipeline to gate a tag on a passing lint run.
  workflow_call:

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
