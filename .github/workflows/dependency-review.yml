name: Dependency Review

# Gates pull requests: scans the dependency changes a PR introduces and fails
# if it pulls in a known-vulnerable or disallowed-license package. Make this a
# required status check in branch protection to block merges. Complements
# Dependabot (which opens upgrade PRs) and govulncheck (which scans existing deps).

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
